    <!-- Header Navigation (Section 1.14.1) -->
    <!-- GTM listens for clicks on .menu-tracking elements; data-menu_type tells it which nav -->
    <nav>
      <ul class="menu-tracking" data-menu_type="header navigation">
        <li><a href="/">Home</a></li>
        <li><a href="#products">Products</a></li>
        <li><a href="#pricing">Pricing</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>

    <h1>Welcome to My Demo Site</h1>
    <p>This site is used for GA4 tracking and Azure Data Factory pipeline testing.</p>

    <!--
      CTA Button Tracking (Section 1.8)
      - class "cta-button-tracking" is required — GTM uses this to identify CTA buttons
      - data-cta_button_tracking value = button_tracking_type selected in CMS
        (use "not selected" as default when no type is assigned)
    -->
    <button id="hero-btn" class="cta-button-tracking" data-cta_button_tracking="get_started">
      Get Started
    </button>

    <button id="learn-btn" class="cta-button-tracking" data-cta_button_tracking="learn_more">
      Learn More
    </button>

    <!--
      Outbound / anchor link — no cta-button-tracking class needed here.
      GTM handles link clicks separately (Section 1.17).
    -->
    <a href="#pricing" id="pricing-link">View Pricing</a>

    <hr/>

    <h2>Products</h2>

    <!-- Product CTA buttons (Section 1.8) -->
    <button id="product-a" class="cta-button-tracking" data-cta_button_tracking="product_a">
      Product A
    </button>

    <button id="product-b" class="cta-button-tracking" data-cta_button_tracking="product_b">
      Product B
    </button>

    <hr/>

    <!-- Footer Navigation (Section 1.14.5) -->
    <footer>

        <li><a href="/terms">Terms of Use</a></li>
        <li><a href="#contact" id="contact">Contact Us</a></li>
      </ul>
    </footer>
